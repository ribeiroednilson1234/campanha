steps:
  - uses: actions/checkout@v3
  - uses: canonical/craft-actions/rockcraft-pack@main
    id: rockcraft
  - uses: actions/upload-artifact@v3
    with:
      name: rock
      path: ${{ steps.rockcraft.outputs.rock }}

{
  "name": "node_web_app",
  "version": "1.0.0",
  "description": "Node.js on a rock",
  "author": "First Last <first.last@example.com>",
  "main": "server.js",
  "scripts": {
    "start": "node server.js"
  },
  "dependencies": {
    "express": "^4.18.2"
  }
}

###Comece em uma pasta vazia e crie um src/subdiretório. Dentro dele, adicione dois arquivos:
###A primeira é a package.jsonlistagem de dependências, com o seguinte conteúdo:
{
  "name": "node_web_app",
  "version": "1.0.0",
  "description": "Node.js on a rock",
  "author": "First Last <first.last@example.com>",
  "main": "server.js",
  "scripts": {
    "start": "node server.js"
  },
  "dependencies": {
    "express": "^4.18.2"
  }
}

###O segundo arquivo é o nosso aplicativo de exemplo, um servidor simples do tipo "olá, mundo".
###Ainda dentro do arquivo src/, adicione o seguinte conteúdo a server.js:

'use strict';

const express = require('express')
const app = express()
const port = 8080
const host = '0.0.0.0'

app.get('/', (req, res) => {
  res.send('Hello World from inside the rock!');
});

app.listen(port, host, () => {
  console.log(`Running on http://${host}:${port}`);
});

###Em seguida, configuraremos o projeto Rockcraft. Na pasta original vazia, crie um arquivo vazio chamado rockcraft.yaml. Em seguida, adicione os seguintes trechos, um após o outro.
###Adicione os metadados que descrevem sua rocha, como seu nome e licença:

name: my-node-app
base: ubuntu@22.04
version: "1.0"
summary: A rock that bundles a simple nodejs app
description: |
  This rock bundles a recent node runtime to serve a simple "hello-world" app.
license: GPL-3.0
platforms:
  amd64:

services:
  app: campanha
    override: replace
    command: node server.js
    startup: enabled
    on-success: shutdown
    on-failure: shutdown
    working-dir: /lib/node_modules/node_web_app

parts:
  app: campanha
    plugin: npm
    npm-include-node: True
    npm-node-version: "21.1.0"
    source: src/
    build-environment:
      # NOTE: There's currently a bad interaction between the nodejs version in the
      # archives and the kernel, causing an infinite hang during 'npm install':
      # - https://github.com/npm/cli/issues/4028
      # - https://github.com/amazonlinux/amazon-linux-2023/issues/856
      # For now we need to disable libuv's use of io_uring; this should be able to
      # be reverted in a few months (as of April 2025).
      # Conforme o exposto acima ativei o uso do UV IO.
      - UV_USE_IO_URING: "1"
